fail_fast: false
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit, manual]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: cargo-fmt
        name: Rust formatting
        entry: make fmt
        language: system
        files: '\.rs$'
        pass_filenames: false
      - id: proto-reproducibility
        name: Protocol reproducibility
        entry: make check-proto
        language: system
        files: '(^Cargo\.(toml|lock)$|^rust-toolchain\.toml$|^vendors/openfga-api/|^crates/openfga-proto/|^tools/openfga-proto-codegen/)'
        pass_filenames: false
      - id: cargo-deny
        name: Dependency policy
        entry: make deny
        language: system
        files: '(^Cargo\.(toml|lock)$|^deny\.toml$|/Cargo\.toml$)'
        pass_filenames: false
      - id: cargo-build
        name: Rust build
        entry: make build
        language: system
        files: '(^Cargo\.(toml|lock)$|\.rs$)'
        pass_filenames: false
      - id: cargo-clippy
        name: Rust lints
        entry: make clippy
        language: system
        files: '(^Cargo\.(toml|lock)$|\.rs$)'
        pass_filenames: false
      - id: cargo-test
        name: Rust tests
        entry: make test
        language: system
        files: '(^Cargo\.(toml|lock)$|\.rs$)'
        pass_filenames: false
