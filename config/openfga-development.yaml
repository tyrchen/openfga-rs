profile: development
listeners:
  http: 127.0.0.1:8080
  grpc: 127.0.0.1:8081
tls:
  enabled: false
  reloadIntervalSeconds: 30
storage:
  backend: memory
  memory:
    actorCapacity: 256
  postgres:
    primaryUrlEnv: OPENFGA_DATABASE_URL
    maxConnections: 16
    minConnections: 0
    acquireTimeoutMs: 5000
    statementTimeoutMs: 5000
    replicaMaxLagMs: 1000
    maxTupleMutations: 100
    migrateOnStart: false
  mysql:
    urlEnv: OPENFGA_MYSQL_URL
    maxConnections: 16
    minConnections: 0
    acquireTimeoutMs: 5000
    statementTimeoutMs: 5000
    maxTupleMutations: 100
    migrateOnStart: false
  sqlite:
    urlEnv: OPENFGA_SQLITE_URL
    maxConnections: 1
    minConnections: 0
    acquireTimeoutMs: 5000
    statementTimeoutMs: 5000
    maxTupleMutations: 100
    migrateOnStart: false
cache:
  model:
    sourceWeight: 67108864
    compiledWeight: 134217728
    conditionCompiledWeight: 67108864
    latestAliases: 10000
    immutableTtlSeconds: 604800
    latestAliasTtlSeconds: 10
  decision:
    weight: 16777216
    ttlSeconds: 10
  tuple:
    weight: 134217728
    maximumResults: 10000
    ttlSeconds: 10
  controller:
    channelCapacity: 1024
    pageSize: 100
    pollIntervalMs: 1000
    readTimeoutMs: 1000
    maximumLagMs: 10000
auth:
  mode: disabled
transport:
  defaultPageSize: 50
  requestTimeoutMs: 5000
  tokenTtlSeconds: 86400
  maximumMessageBytes: 1048576
  maximumWireCacheBytes: 67108864
  maximumConcurrency: 64
  tokenKeyId: primary
  tokenKeyEnv: OPENFGA_TOKEN_KEY
  tokenVerificationKeys: []
  admission:
    windowSeconds: 60
    authenticationAttempts: 20000
    authenticationFailures: 2000
    globalAuthenticationAttempts: 200000
    globalAuthenticationFailures: 20000
    administration: 1000
    reads: 10000
    writes: 2000
    checks: 20000
    enumeration: 1000
authzen:
  enabled: true
  baseUrl: http://127.0.0.1:8080
evaluator:
  depth: 25
  dispatches: 10000
  datastoreQueries: 100
  tupleItems: 10000
  conditionCost: 100000
  concurrentReads: 8
  batchConcurrency: 8
  coalescingMode: shadow
  coalescingMaximumInFlightKeys: 4096
listObjects:
  candidateDepth: 25
  candidateDispatches: 10000
  candidateDatastoreQueries: 1000
  candidateTupleItems: 10000
  candidates: 10000
  residualDispatches: 10000
  residualDatastoreQueries: 1000
  residualTupleItems: 10000
  residualConcurrency: 8
  streamBuffer: 16
listUsers:
  depth: 25
  dispatches: 10000
  datastoreQueries: 1000
  tupleItems: 10000
  subjects: 10000
  conditionCost: 100000
expand:
  depth: 25
  nodes: 10000
  datastoreQueries: 1000
  tupleItems: 10000
  responseBytes: 1048576
telemetry:
  logFormat: pretty
  logFilter: info
  exportTimeoutMs: 5000
shutdown:
  drainTimeoutMs: 10000
  healthIntervalMs: 1000
